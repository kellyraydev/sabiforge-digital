<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: 'Segoe UI', Inter, sans-serif;
        color: #1c1916;
      }
      button {
        font: inherit;
      }
      button:disabled {
        cursor: not-allowed;
      }
      img {
        max-width: 100%;
      }

      body {
        background: #fbf6f2;
        color: #6e2438;
      }
      header {
        height: 78px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 32px;
      }
      .brand {
        font-family: Georgia, serif;
        font-size: 26px;
      }
      main {
        padding: 8px 32px 24px;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 500;
        font-size: 48px;
        margin: 0 0 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      .item {
        background: #fff;
        border-radius: 18px;
        min-height: 150px;
        padding: 16px;
        display: flex;
        align-items: flex-end;
        border-bottom: 4px solid #c4a265;
      }
      .item:nth-child(odd) {
        background: #f4d6d8;
      }
      @media (max-width: 700px) {
        header {
          padding: 0 16px;
        }
        main {
          padding: 8px 16px;
        }
        h1 {
          font-size: 34px;
        }
        .grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .item {
          min-height: 96px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Big Beerah Collection</div>
      <span>Concept project</span>
    </header>
    <main>
      <h1>Modest fashion and accessories.</h1>
      <p>Uncommissioned concept. No prices, stock counts or contact details.</p>
      <div class="grid">
        <article class="item">Hijabs</article>
        <article class="item">Abayas</article>
        <article class="item">Jersey scarves</article>
        <article class="item">Necklaces</article>
        <article class="item">Fabrics</article>
        <article class="item">Ready to wear</article>
        <article class="item">Gift boxes</article>
        <article class="item">Everyday essentials</article>
      </div>
    </main>
  </body>
</html>
